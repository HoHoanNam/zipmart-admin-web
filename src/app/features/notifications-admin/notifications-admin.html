<div class="mx-auto max-w-lg">
  <h1 class="mb-2 text-2xl font-bold text-slate-900">Gửi thông báo</h1>
  <p class="mb-6 text-sm text-slate-500">Thông báo sẽ được gửi tới toàn bộ người dùng hiện có.</p>

  <div class="rounded-xl border border-slate-200 bg-white p-5">
    @if (error()) {
      <p class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">
        {{ error() }}
      </p>
    }
    @if (lastRecipientCount(); as count) {
      <p class="mb-3 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-sm text-green-700">
        Đã gửi tới {{ count }} người dùng.
      </p>
    }

    <div class="space-y-3">
      <input
        placeholder="Tiêu đề"
        [(ngModel)]="title"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
      />
      <textarea
        placeholder="Nội dung"
        rows="4"
        [(ngModel)]="body"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"
      ></textarea>
    </div>

    <button
      type="button"
      [disabled]="sending() || !title.trim() || !body.trim()"
      (click)="send()"
      class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
    >
      {{ sending() ? 'Đang gửi...' : 'Gửi thông báo' }}
    </button>
  </div>
</div>
