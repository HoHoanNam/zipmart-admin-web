<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-slate-900">Mã giảm giá</h1>
  <button
    type="button"
    (click)="startCreate()"
    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
  >
    + Thêm mã
  </button>
</div>

@if (creating()) {
  <div class="mb-6 rounded-xl border border-indigo-200 bg-indigo-50 p-5">
    <h2 class="mb-3 text-sm font-semibold text-slate-900">Mã giảm giá mới</h2>

    @if (error()) {
      <p class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">
        {{ error() }}
      </p>
    }

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
      <input
        placeholder="Mã (vd: WELCOME10)"
        [ngModel]="form().code"
        (ngModelChange)="updateForm('code', $event)"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm uppercase"
      />
      <input
        type="number"
        min="0"
        max="100"
        placeholder="Giảm giá (%)"
        [ngModel]="form().discountPercent"
        (ngModelChange)="updateForm('discountPercent', +$event)"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
      />
      <label class="flex items-center gap-2 text-sm text-slate-600">
        <input
          type="checkbox"
          [ngModel]="form().active"
          (ngModelChange)="updateForm('active', $event)"
        />
        Kích hoạt ngay
      </label>
    </div>

    <div class="mt-4 flex gap-2">
      <button
        type="button"
        [disabled]="saving()"
        (click)="save()"
        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
      >
        {{ saving() ? 'Đang lưu...' : 'Lưu' }}
      </button>
      <button
        type="button"
        (click)="cancelCreate()"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-white"
      >
        Huỷ
      </button>
    </div>
  </div>
}

@if (loading()) {
  <div class="h-40 animate-pulse rounded-xl bg-slate-100"></div>
} @else {
  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
        <tr>
          <th class="px-4 py-3">Mã</th>
          <th class="px-4 py-3 text-right">Giảm giá</th>
          <th class="px-4 py-3">Trạng thái</th>
          <th class="px-4 py-3">Ngày tạo</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (coupon of coupons(); track coupon.id) {
          <tr>
            <td class="px-4 py-3 font-mono font-medium text-slate-900">{{ coupon.code }}</td>
            <td class="px-4 py-3 text-right">{{ coupon.discountPercent }}%</td>
            <td class="px-4 py-3">
              <button
                type="button"
                (click)="toggleActive(coupon)"
                class="rounded-full px-2.5 py-0.5 text-xs font-medium"
                [class.bg-green-100]="coupon.active"
                [class.text-green-700]="coupon.active"
                [class.bg-slate-100]="!coupon.active"
                [class.text-slate-500]="!coupon.active"
              >
                {{ coupon.active ? 'Đang hoạt động' : 'Ngừng hoạt động' }}
              </button>
            </td>
            <td class="px-4 py-3 text-slate-500">{{ coupon.createdAt | date: 'dd/MM/yyyy' }}</td>
            <td class="px-4 py-3 text-right">
              <button type="button" (click)="remove(coupon.id)" class="text-red-600 hover:underline">
                Xoá
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
