<div [style.height.px]="heightPx()">
  @if (products().length === 0) {
    <div class="flex h-full items-center justify-center text-sm text-slate-400">Không có dữ liệu.</div>
  } @else {
    <canvas
      baseChart
      [type]="chartType"
      [data]="chartData()"
      [options]="chartOptions"
    ></canvas>
  }
</div>
