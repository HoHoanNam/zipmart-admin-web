<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-slate-900">Sản phẩm</h1>
  <button
    type="button"
    (click)="startCreate()"
    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
  >
    + Thêm sản phẩm
  </button>
</div>

@if (editingId()) {
  <div class="mb-6 rounded-xl border border-indigo-200 bg-indigo-50 p-5">
    <h2 class="mb-3 text-sm font-semibold text-slate-900">
      {{ editingId() === 'new' ? 'Sản phẩm mới' : 'Sửa sản phẩm' }}
    </h2>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
      <input
        placeholder="Tên sản phẩm"
        [ngModel]="form().name"
        (ngModelChange)="updateForm('name', $event)"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
      />
      <input
        type="number"
        placeholder="Giá"
        [ngModel]="form().price"
        (ngModelChange)="updateForm('price', $event)"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
      />
      <input
        type="number"
        placeholder="Tồn kho"
        [ngModel]="form().stock"
        (ngModelChange)="updateForm('stock', +$event)"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm"
      />
    </div>
    <div class="mt-4 flex gap-2">
      <button
        type="button"
        [disabled]="saving()"
        (click)="save()"
        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
      >
        {{ saving() ? 'Đang lưu...' : 'Lưu' }}
      </button>
      <button
        type="button"
        (click)="cancelEdit()"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-white"
      >
        Huỷ
      </button>
    </div>
  </div>
}

@if (loading()) {
  <div class="h-40 animate-pulse rounded-xl bg-slate-100"></div>
} @else {
  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
        <tr>
          <th class="px-4 py-3">Tên</th>
          <th class="px-4 py-3 text-right">Giá</th>
          <th class="px-4 py-3 text-right">Tồn kho</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (product of products(); track product.id) {
          <tr>
            <td class="px-4 py-3 font-medium text-slate-900">{{ product.name }}</td>
            <td class="px-4 py-3 text-right">{{ product.price | vndCurrency }}</td>
            <td class="px-4 py-3 text-right">{{ product.stock }}</td>
            <td class="px-4 py-3 text-right">
              <button type="button" (click)="startEdit(product)" class="text-indigo-600 hover:underline">
                Sửa
              </button>
              <button
                type="button"
                (click)="remove(product.id)"
                class="ml-3 text-red-600 hover:underline"
              >
                Xoá
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
