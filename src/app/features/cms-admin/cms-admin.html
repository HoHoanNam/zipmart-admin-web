<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-slate-900">Trang tĩnh / Blog</h1>
  <button
    type="button"
    (click)="startCreate()"
    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700"
  >
    + Trang mới
  </button>
</div>

@if (error() && !creating()) {
  <p class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">
    {{ error() }}
  </p>
}

<app-data-table
  [columns]="columns"
  [rows]="pages()"
  [loading]="loading()"
  trackByKey="id"
  emptyMessage="Chưa có trang nào."
>
  <ng-template appDataTableCell="title" let-row>
    <button type="button" (click)="edit(row)" class="font-medium text-indigo-600 hover:underline">
      {{ row.title }}
    </button>
  </ng-template>
  <ng-template appDataTableCell="slug" let-row>
    <span class="font-mono text-xs">/{{ row.slug }}</span>
  </ng-template>
  <ng-template appDataTableCell="status" let-row>
    <span
      class="rounded-full px-2.5 py-0.5 text-xs font-medium"
      [class.bg-green-100]="row.status === 'published'"
      [class.text-green-700]="row.status === 'published'"
      [class.bg-slate-100]="row.status === 'draft'"
      [class.text-slate-500]="row.status === 'draft'"
    >
      {{ row.status === 'published' ? 'Đã xuất bản' : 'Bản nháp' }}
    </span>
  </ng-template>
  <ng-template appDataTableCell="updatedAt" let-row>{{ row.updatedAt | date: 'dd/MM/yyyy HH:mm' }}</ng-template>
  <ng-template appDataTableCell="actions" let-row>
    <button type="button" (click)="edit(row)" class="text-indigo-600 hover:underline">Sửa</button>
    <button type="button" (click)="remove(row)" class="ml-3 text-red-600 hover:underline">Xoá</button>
  </ng-template>
</app-data-table>

<app-modal [open]="creating()" title="Tạo trang mới" (closed)="closeCreate()">
  @if (error()) {
    <p class="mb-3 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">
      {{ error() }}
    </p>
  }

  <div class="grid grid-cols-1 gap-3">
    <label class="text-xs text-slate-500">
      Tiêu đề
      <input [(ngModel)]="title" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="text-xs text-slate-500">
      Slug (đường dẫn, vd: "gioi-thieu")
      <input [(ngModel)]="slug" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
  </div>

  <div modal-footer>
    <button
      type="button"
      (click)="closeCreate()"
      class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50"
    >
      Huỷ
    </button>
    <button
      type="button"
      [disabled]="saving()"
      (click)="save()"
      class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-60"
    >
      {{ saving() ? 'Đang tạo...' : 'Tạo &amp; mở soạn thảo' }}
    </button>
  </div>
</app-modal>
