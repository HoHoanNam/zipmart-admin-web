<h1 class="mb-6 text-2xl font-bold text-slate-900">Người dùng</h1>

@if (loading()) {
  <div class="h-40 animate-pulse rounded-xl bg-slate-100"></div>
} @else {
  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-left text-xs uppercase text-slate-500">
        <tr>
          <th class="px-4 py-3">Email</th>
          <th class="px-4 py-3">Ngày tạo</th>
          <th class="px-4 py-3">Vai trò</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (user of users(); track user.id) {
          <tr>
            <td class="px-4 py-3 font-medium text-slate-900">{{ user.email }}</td>
            <td class="px-4 py-3">{{ user.createdAt | date: 'dd/MM/yyyy' }}</td>
            <td class="px-4 py-3">
              <select
                (change)="changeRole(user, $any($event.target).value)"
                class="rounded-lg border border-slate-300 px-2 py-1 text-xs"
              >
                @for (role of roles; track role) {
                  <option [value]="role" [selected]="role === user.role">{{ role }}</option>
                }
              </select>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
