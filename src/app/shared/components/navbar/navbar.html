<header class="flex h-screen w-56 shrink-0 flex-col border-r border-slate-200 bg-white">
  <div class="border-b border-slate-200 px-5 py-4">
    <span class="text-lg font-bold text-indigo-600">zipmart</span>
    <span class="ml-1 text-xs font-medium text-slate-400">admin</span>
  </div>

  <nav class="flex flex-1 flex-col gap-1 p-3 text-sm font-medium text-slate-600">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-indigo-50 text-indigo-600"
      class="rounded-lg px-3 py-2 hover:bg-slate-100"
    >
      Tổng quan
    </a>
    <a
      routerLink="/products"
      routerLinkActive="bg-indigo-50 text-indigo-600"
      class="rounded-lg px-3 py-2 hover:bg-slate-100"
    >
      Sản phẩm
    </a>
    <a
      routerLink="/orders"
      routerLinkActive="bg-indigo-50 text-indigo-600"
      class="rounded-lg px-3 py-2 hover:bg-slate-100"
    >
      Đơn hàng
    </a>
    <a
      routerLink="/users"
      routerLinkActive="bg-indigo-50 text-indigo-600"
      class="rounded-lg px-3 py-2 hover:bg-slate-100"
    >
      Người dùng
    </a>
    <a
      routerLink="/analytics"
      routerLinkActive="bg-indigo-50 text-indigo-600"
      class="rounded-lg px-3 py-2 hover:bg-slate-100"
    >
      Thống kê
    </a>
  </nav>

  <div class="border-t border-slate-200 p-3">
    <button
      type="button"
      (click)="logout()"
      class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-600 hover:bg-slate-100"
    >
      Đăng xuất
    </button>
  </div>
</header>
